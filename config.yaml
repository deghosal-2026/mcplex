connectors:
  - name: guardian
    type: http
    base_url: http://guardian:8080
    tools:
      - name: guardian_check_policy
        description: >
          Check a pull request against AI code governance policy.
          Returns pass/fail per rule with evidence.
        http:
          method: POST
          path: /mcp/policy/check
          param_mapping:
            repo: repo
            pr_number: pr_number
        parameters:
          repo:
            type: string
            description: "Repository name (e.g. my-org/payment-service)"
          pr_number:
            type: integer
            description: "Pull request number"
        
      - name: guardian_get_coverage
        description: >
          Get governance coverage score for a repository.
          Shows what percentage of PRs are reviewed by governance.
        http:
          method: GET
          path: /mcp/stats
          param_mapping:
            repo: repo
        parameters:
          repo:
            type: string
            description: "Repository name"
        
  - name: ci-agent
    type: http
    base_url: http://ci-doctor:8080
    tools:
      - name: ci_diagnose_failure
        description: >
          Diagnose a CI failure from logs.
          Returns root cause, suggested fix, and similar past failures.
        http:
          method: POST
          path: /api/diagnose
          param_mapping:
            repo: repo
            run_id: run_id
        parameters:
          repo:
            type: string
            description: "Repository name"
          run_id:
            type: string
            description: "CI run ID"
        
      - name: ci_get_pipeline_history
        description: >
          Get CI pipeline history with failure pattern analysis.
        http:
          method: GET
          path: /api/history
          param_mapping:
            repo: repo
            days: days
        parameters:
          repo:
            type: string
            description: "Repository name"
          days:
            type: integer
            description: "Number of days to look back"
        
  - name: sprintsense
    type: http
    base_url: http://sprint-intel:5000
    tools:
      - name: dora_get_metrics
        description: >
          Get DORA metrics for a team or service.
          Returns deploy frequency, lead time, MTTR, change failure rate.
        http:
          method: GET
          path: /mcp/dora/metrics
          param_mapping:
            scope: scope
            days: days
        parameters:
          scope:
            type: string
            description: "Team or service name"
          days:
            type: integer
            description: "Lookback period in days"
        
      - name: dora_get_trend
        description: >
          Get DORA metrics trend over a configurable period.
        http:
          method: GET
          path: /mcp/dora/trend
          param_mapping:
            scope: scope
            days: days
        parameters:
          scope:
            type: string
            description: "Team or service name"
          days:
            type: integer
            description: "Lookback period in days"
        
  - name: incident-commander
    type: http
    base_url: http://test-bench:8004
    tools:
      - name: incident_query_active
        description: >
          Query currently active incidents.
          Returns ongoing incidents with severity, service, duration, and responder.
        http:
          method: GET
          path: /api/incidents/active
          param_mapping:
            service: service
            severity: severity
        parameters:
          service:
            type: string
            description: "Filter by service name (optional)"
          severity:
            type: string
            description: "Filter by sev1/sev2/sev3 (optional)"
        
      - name: incident_query_history
        description: >
          Query historical incidents with optional filters for service and time range.
        http:
          method: GET
          path: /api/incidents/history
          param_mapping:
            service: service
            days: days
        parameters:
          service:
            type: string
            description: "Filter by service name"
          days:
            type: integer
            description: "Number of days to look back"
        
      - name: incident_get_timeline
        description: >
          Get full incident timeline with all events, decisions, and correlated deploys.
        http:
          method: GET
          path: /api/incidents/timeline
          param_mapping:
            incident_id: incident_id
        parameters:
          incident_id:
            type: string
            description: "Incident ID (e.g. INC-2026-142)"
        